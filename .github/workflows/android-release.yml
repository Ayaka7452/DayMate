name: Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google 已把遗留的 `tools` 包从 SDK 仓库下架，本 action 的默认值仍会去装它，
          # 导致 sdkmanager 报 "Failed to find package 'tools'" 直接失败。
          # 只装 platform-tools；platform / build-tools 由 Gradle 按需拉取。
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p /tmp/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore/sign.keystore
          ls -la /tmp/keystore/

      - name: Build Release APK
        env:
          KEYSTORE_PATH: /tmp/keystore/sign.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: daymate-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 自动发布：读版本号 → 资产改名 → 清旧 Release（只留 v1.0.0 与最新）→ 建 Release（tag 不存在则自动在 HEAD 创建）
      # 同版本重跑是幂等的：先删同名 Release（tag 留仓）再重建。
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          ASSET="DayMate-v${VERSION}-signed.apk"
          cp app/build/outputs/apk/release/app-release.apk "$ASSET"

          # 清旧：除 v1.0.0 和当前版本外全部删除（只删 Release，tag 全留）
          gh release list --json tagName -q '.[].tagName' | while read -r t; do
            if [ -n "$t" ] && [ "$t" != "v${VERSION}" ] && [ "$t" != "v1.0.0" ]; then
              gh release delete "$t" --yes || true
            fi
          done
          # 同版本重跑：删掉同名 Release 后重建（幂等）
          gh release delete "v${VERSION}" --yes 2>/dev/null || true

          printf 'DayMate v%s\n\n%s\n' "$VERSION" "${COMMIT_MSG:-DayMate v${VERSION}}" > release_notes.md
          gh release create "v${VERSION}" "${ASSET}#${ASSET}" \
            --title "v${VERSION}" --notes-file release_notes.md

          # 发布后自检：资产 name 与 size 必须正确（label 会骗人，name 才是下载文件名）
          gh release view "v${VERSION}" --json tagName,assets \
            -q '"tag=\(.tagName)", (.assets[] | "asset=\(.name) size=\(.size)")'